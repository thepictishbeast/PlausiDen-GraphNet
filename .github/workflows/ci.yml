name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: rust (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable]
    steps:
      - uses: actions/checkout@v4

      - name: install rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --workspace --locked

      - name: doc
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  python:
    name: python (3.${{ matrix.python-minor }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-minor: ["10", "11", "12"]
    steps:
      - uses: actions/checkout@v4

      - name: install python 3.${{ matrix.python-minor }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.${{ matrix.python-minor }}"

      - name: install rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest hypothesis ruff mypy maturin
          # heavy viz deps used by python/tests/test_viz*.py
          pip install matplotlib plotly scikit-learn graphviz

      - name: ruff check
        run: ruff check python/

      - name: build + install native extension
        # pip install -e . routes through the maturin PEP 517 backend
        # declared in pyproject.toml, which works with the system Python
        # (no venv required, unlike `maturin develop`).
        run: pip install -e . --no-build-isolation

      - name: pytest (includes native bindings tests)
        run: pytest python/tests/ -q

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: install cargo-audit
        run: cargo install --locked cargo-audit || true

      - name: audit
        run: cargo audit
