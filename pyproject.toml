[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "plausiden-graphnet"
version = "0.1.0"
description = "Live REPL + interactive graphical environment for neural-network architecture work"
readme = "README.md"
license = { text = "FSL-1.1-MIT" }
requires-python = ">=3.10"
authors = [{ name = "William Armstrong / PlausiDen" }]
keywords = ["neural-network", "hdc", "vsa", "visualization", "repl", "interactive"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
jupyter = [
    "ipython>=8.20",
    "jupyter>=4",
    "ipywidgets>=8.1",
    "plotly>=5.24",
    "k3d>=2.16",
]
viz = [
    "plotly>=5.24",
    "graphviz>=0.20",
    "networkx>=3.3",
]
adapters = [
    "transformers>=4.45",
    "tokenizers>=0.20",
    "torch>=2.5",
    "safetensors>=0.4",
]
monitor = [
    "psutil>=6.0",
    "pynvml>=12",
]
maths = [
    "scikit-learn>=1.5",
    "umap-learn>=0.5",
    "pywavelets>=1.7",
    "sympy>=1.13",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.urls]
Repository = "https://github.com/thepictishbeast/PlausiDen-GraphNet"

[tool.maturin]
features = ["pyo3/extension-module"]
manifest-path = "crates/graphnet-bindings/Cargo.toml"
module-name = "graphnet._graphnet_native"
python-source = "python"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
