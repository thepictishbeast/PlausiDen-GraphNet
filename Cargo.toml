[workspace]
members = [
    "crates/graphnet-engine",
    "crates/graphnet-bindings",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "FSL-1.1-MIT"
repository = "https://github.com/thepictishbeast/PlausiDen-GraphNet"
authors = ["William Armstrong / PlausiDen"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
bincode = "2"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
crossbeam-channel = "0.5"
rayon = "1.10"
rustfft = "6"
ndarray = "0.16"
nalgebra = "0.33"
rand = "0.8"
rand_chacha = "0.3"
blake3 = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
proptest = "1"
criterion = "0.5"
similar = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "thin"
