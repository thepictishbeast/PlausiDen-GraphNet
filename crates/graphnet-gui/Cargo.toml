[package]
name = "graphnet-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "GraphNet native GUI shell (egui + eframe) — Phase 12 scaffold"

[[bin]]
name = "graphnet-gui"
path = "src/main.rs"

[dependencies]
graphnet-engine = { path = "../graphnet-engine" }
plausiden-hdc = { git = "https://github.com/thepictishbeast/PlausiDen-Stack", rev = "d2207b2085c0815950e3411365c0c7ecf80e5636" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.29"
egui_plot = "0.29"
egui-phosphor = "0.7"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
blake3 = "1.5"
bytemuck = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
# safetensors reads HF model weight files (#777). Lightest viable
# step toward general neural-net loading — metadata + raw bytes only,
# no inference compute. Candle integration is a later iter.
safetensors = "0.4"
# evalexpr — runtime formula evaluator for LayerKind::SymbolicFormula.
# Tiny (~20KB), no_std-compatible, supports +,-,*,/,sin,cos,sqrt,log,
# variables. Makes the novel-AI symbolic layers actually compute.
evalexpr = "11"
# rodio is deferred — requires libasound2-dev on Linux. Reinstate when
# the build host has it. Audio toggle is wired but produces silence.
# rodio = { version = "0.19", default-features = false }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
