[package]
name = "graphnet-bindings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "GraphNet Python bindings (PyO3 0.24)"

[lib]
name = "_graphnet_native"
crate-type = ["rlib", "cdylib"]

[dependencies]
graphnet-engine = { path = "../graphnet-engine" }
plausiden-hdc = { git = "https://github.com/thepictishbeast/PlausiDen-Stack", rev = "d2207b2085c0815950e3411365c0c7ecf80e5636" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
bincode = { workspace = true }
thiserror.workspace = true

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
